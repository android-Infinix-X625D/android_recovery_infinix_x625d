name: Build OrangeFox X625D

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Build type (pre-release = draft GitHub Release; release = published GitHub Release)"
        type: choice
        required: true
        default: "pre-release"
        options:
          - pre-release
          - release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout device tree
      uses: actions/checkout@v5
      with:
        path: device-tree

    - name: Free space
      run: |
        sudo apt-get clean
        df -h

        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
        df -h

    - name: Setup Java 8 for Android 9
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Cache APT packages (saves ~3-5 min per run)
      uses: awalsh128/cache-apt-pkgs-action@v1
      with:
        packages: git python3 android-tools-adb bc bison build-essential curl flex g++-multilib gcc-multilib gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev cpio ccache
        version: 1.0

    - name: Install deps (fast, no full apt update)
      run: |
        # Only what jammy lacks: it dropped libncurses5 (header-abi-dumper) and python2, so those come from focal.
        if [ ! -f /lib/x86_64-linux-gnu/libncurses.so.5 ] && [ ! -f /usr/lib/x86_64-linux-gnu/libncurses.so.5 ]; then
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb -O /tmp/libtinfo5.deb
          wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb -O /tmp/libncurses5.deb
          sudo dpkg -i /tmp/libtinfo5.deb /tmp/libncurses5.deb || sudo apt-get -f install -y
        fi
        ls -lh /lib/x86_64-linux-gnu/libncurses* /usr/lib/x86_64-linux-gnu/libncurses* || true

        # Android 9 wants python2 as the default (check_radio_versions.py).
        if [ ! -x /usr/bin/python2 ] && [ ! -x /usr/bin/python2.7 ]; then
          echo "deb http://archive.ubuntu.com/ubuntu/ focal universe" | sudo tee /etc/apt/sources.list.d/focal-universe.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/focal-universe.list" -o Dir::Etc::sourceparts="-" -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y --no-install-recommends python2 python2.7 python2.7-minimal libpython2.7-minimal libpython2.7-stdlib || sudo apt-get install -y python2.7
          sudo rm -f /etc/apt/sources.list.d/focal-universe.list
        fi
        sudo ln -sf /usr/bin/python2 /usr/bin/python || sudo ln -sf /usr/bin/python2.7 /usr/bin/python
        python --version
        python3 --version

        mkdir -p ~/bin
        if [ ! -x ~/bin/repo ]; then
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
        fi
        echo "$HOME/bin" >> $GITHUB_PATH

        git config --global user.name "gh-action"
        git config --global user.email "gh-action@local"
        git config --global color.ui false

    - name: Sync OrangeFox 9.0 legacy (for Android 9 X625D)
      run: |
        git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync
        ls -la OrangeFox_sync/ OrangeFox_sync/legacy/patches/
        chmod +x OrangeFox_sync/legacy/orangefox_sync_legacy.sh

        # The legacy script reads patches/, but the 9.0 patch lives in legacy/patches/.
        mkdir -p OrangeFox_sync/patches
        cp OrangeFox_sync/legacy/patches/patch-manifest-fox_9.0.diff OrangeFox_sync/patches/ || true
        cd OrangeFox_sync

        # A cached fox/ can be corrupt ("unsupported checkout state"), so clean it first.
        if [ -d "$GITHUB_WORKSPACE/fox/.repo" ]; then
          cd "$GITHUB_WORKSPACE/fox" || true
          repo forall -c 'git am --abort 2>/dev/null || true; git rebase --abort 2>/dev/null || true; git reset --hard 2>/dev/null || true; git clean -fdx 2>/dev/null || true' || true
          # The project that corrupts most often.
          rm -rf "$GITHUB_WORKSPACE/fox/bootable/recovery/.git" || true
          cd "$GITHUB_WORKSPACE/OrangeFox_sync" || cd OrangeFox_sync || true
          cd $GITHUB_WORKSPACE/OrangeFox_sync
        fi

        ./legacy/orangefox_sync_legacy.sh --branch 9.0 --path $GITHUB_WORKSPACE/fox || {
          echo "First sync failed, retrying with a force-sync..."
          cd $GITHUB_WORKSPACE/fox
          repo sync -j1 --fail-fast --force-sync bootable/recovery || rm -rf $GITHUB_WORKSPACE/fox/bootable/recovery
          cd $GITHUB_WORKSPACE/OrangeFox_sync
          ./legacy/orangefox_sync_legacy.sh --branch 9.0 --path $GITHUB_WORKSPACE/fox
        }
        df -h

    - name: Copy device tree X625D
      run: |
        mkdir -p fox/device/infinix/X625D
        cp -r device-tree/* fox/device/infinix/X625D/

        ls -R fox/device/infinix/X625D | head -n 50
        ls -lh fox/device/infinix/X625D/prebuilt/

    - name: Ensure OrangeFox theme at the pinned submodule commit
      env:
        THEME_SHA: 51b06e501e32fa69df28a507b0a64382be6d2db4
      run: |
        # gui/theme is a submodule the sync often skips.
        # 0005-0007 were made against this exact revision, so pin it before patching.
        THEME=fox/bootable/recovery/gui/theme
        if [ -e "$THEME/.git" ] && [ "$(git -C "$THEME" rev-parse HEAD 2>/dev/null)" = "$THEME_SHA" ]; then
          echo "theme already at $THEME_SHA"
        else
          # .gitmodules uses an SSH URL that CI cannot use, so fetch over HTTPS.
          echo "checking out theme at $THEME_SHA"
          rm -rf "$THEME"
          git init -q "$THEME"
          git -C "$THEME" remote add origin https://gitlab.com/OrangeFox/misc/theme.git
          git -C "$THEME" fetch -q --depth=1 origin "$THEME_SHA"
          git -C "$THEME" checkout -q FETCH_HEAD
        fi

        test "$(git -C "$THEME" rev-parse HEAD)" = "$THEME_SHA"

    - name: Apply device-tree patches to the Fox source
      run: |
        # Patches are applied on top of the synced source in numeric order.
        # 0001-0004: realtime battery, 3-finger screenshot, full factory reset, ORS wipe state.
        # 0005-0007: the "Erasing..." screen for wipes (icon, text, all languages).
        cd fox/bootable/recovery
        for p in "$GITHUB_WORKSPACE"/device-tree/patches/*.patch; do
          [ -e "$p" ] || continue
          echo "Applying patch $p"
          git apply -v "$p" || { echo "ERROR: $p failed"; git apply -v --reject "$p"; exit 1; }
        done

        echo "--- Factory_Reset() after patches ---"
        sed -n '/TWPartitionManager::Factory_Reset(/,/^}/p' partitionmanager.cpp
        echo "--- ORS wipe state after patches ---"
        grep -n "tw_ors_wipe" openrecoveryscript.cpp
        echo "--- ota_simple page after patches ---"
        sed -n '/<page name="ota_simple">/,/<\/page>/p' gui/theme/portrait_hdpi/pages/universal.xml | head -40

    - name: Setup ccache (incremental, no run_id)
      uses: hendrikmuhs/ccache-action@v1.2.24
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      with:
        key: fox90-X625D
        restore-keys: fox90-X625D
        max-size: 5G

    - name: Build recovery
      working-directory: fox
      env:
        CCACHE_DIR: ${{ github.workspace }}/.ccache
      run: |
        export LC_ALL=C
        export ALLOW_MISSING_DEPENDENCIES=true
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export FOX_BUILD_DEVICE=X625D
        export OF_USE_LZMA_COMPRESSION=1
        export FOX_DRASTIC_SIZE_REDUCTION=1
        export USE_CCACHE=1
        export CCACHE_EXEC=$(which ccache)

        ccache -z
        source build/envsetup.sh
        lunch omni_X625D-eng
        mka recoveryimage -j$(nproc --all)
        ccache -s
        ls -lh out/target/product/X625D/recovery.img

        echo "X625D OrangeFox unofficial $(date -u)" > out/target/product/X625D/build-info.txt
        # Device-tree commit, so the .img is traceable (its .git is not copied).
        DT_SHORT=$(git -C $GITHUB_WORKSPACE/device-tree rev-parse --short HEAD)
        DT_SHA=$(git -C $GITHUB_WORKSPACE/device-tree rev-parse HEAD)
        DT_MSG=$(git -C $GITHUB_WORKSPACE/device-tree log -1 --pretty=%s)
        echo "$DT_SHORT $DT_MSG" >> out/target/product/X625D/build-info.txt
        echo "$DT_SHA" >> out/target/product/X625D/build-info.txt
        cat out/target/product/X625D/build-info.txt

    - name: Name the image and compute the tag (version pulled from OrangeFox)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Tag scheme: <fox base>-<date> (e.g. 11.1-20261023), with the base version never hardcoded.
        # It comes from OrangeFox itself: variables.h of the synced source, then FOX_BASE_VERSION, then the fox_9.0 API.
        FOX_BASE_RAW=""
        if [ -f "$GITHUB_WORKSPACE/fox/bootable/recovery/variables.h" ]; then
          FOX_BASE_RAW="$(grep -m1 -oE 'R[0-9]+\.[0-9]+' "$GITHUB_WORKSPACE/fox/bootable/recovery/variables.h")"
        fi
        if [ -z "$FOX_BASE_RAW" ] && [ -f "OrangeFox_sync/legacy/orangefox_sync_legacy.sh" ]; then
          FOX_BASE_RAW="$(grep -m1 'FOX_BASE_VERSION' OrangeFox_sync/legacy/orangefox_sync_legacy.sh | grep -oE 'R[0-9]+\.[0-9]+')"
        fi
        if [ -z "$FOX_BASE_RAW" ]; then
          FOX_BASE_RAW="$(curl -sfL "https://gitlab.com/api/v4/projects/OrangeFox%2Fbootable%2FRecovery/repository/files/variables.h/raw?ref=fox_9.0" | grep -m1 -oE 'R[0-9]+\.[0-9]+' || true)"
        fi

        # Last resort fallback so the job still publishes with a placeholder.
        [ -z "$FOX_BASE_RAW" ] && FOX_BASE_RAW="R0.0"
        FOX_BASE="${FOX_BASE_RAW#R}"
        echo "OrangeFox base version detected: R$FOX_BASE"
        echo "FOX_BASE=$FOX_BASE" >> $GITHUB_ENV

        # Stamp the detected version into build-info, keeping the existing timestamp.
        sed -i "1s/unofficial/unofficial R$FOX_BASE/" fox/out/target/product/X625D/build-info.txt

        VERSION="${FOX_BASE}"
        DATE=$(date +'%Y%m%d')
        SHORT=$(git -C device-tree rev-parse --short HEAD)
        SHA=$(git -C device-tree rev-parse HEAD)
        BRANCH="${GITHUB_REF_NAME}"

        # Stable: tag <VERSION>-<DATE>, then <VERSION>-<DATE>.N for later builds that day.
        # The counter counts release names and tags, drafts included.
        # Pre-release: always the rolling draft <VERSION>-pre, identified by its asset name.
        # Asset names look like OrangeFox-X625D-<VERSION>-<DATE>[-.N]-<short>.img.
        # Every API call goes through gh_retry.
        # It retries transient errors for up to 1h and fails at once on auth errors.

        export GH_TOKEN="${GITHUB_TOKEN}"
        REPO_S="${GITHUB_REPOSITORY}"
        gh_retry() {
          # Retry only transient errors (rate limit, 429, 5xx, network), and fail at once on 401/403/404.
          local out i
          for i in $(seq 1 120) ; do
            if out=$(gh api "$@" 2>/tmp/gh-api.err); then
              printf '%s\n' "$out"
              return 0
            fi
            err="$(cat /tmp/gh-api.err 2>/dev/null || true)"
            if printf '%s' "$err" | grep -qiE 'resource not accessible|HTTP 40[14]'; then
              echo "gh api '$*' unrecoverable error (check workflow permissions): $err" >&2
              return 1
            fi
            echo "gh api '$*' attempt $i failed, waiting 30s: $(printf '%s' "$err" | tail -1)"
            sleep 30
          done
          echo "gh api '$*' still failing after 1h of retries" >&2
          return 1
        }

        all_existing_names() {
          # Release names (drafts included), then every tag ever created.
          gh_retry "repos/$REPO_S/releases?per_page=100" --paginate --jq '.[].tag_name' || true
          gh_retry "repos/$REPO_S/tags?per_page=100" --paginate --jq '.[].name' || true
        }

        if [ "${{ inputs.release_type }}" = "release" ]; then
          BASE_TAG="${VERSION}-${DATE}"
          MAXN=0     # highest same-day suffix already present (0 = none)
          OCC=0      # the exact / legacy same-day name is taken
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            suffix=""
            if [ "$name" = "$BASE_TAG" ]; then
              suffix=0
            elif [ "${name#"$BASE_TAG"-}" != "$name" ]; then
              suffix="0"   # legacy "-2, -3" format from the old release loop
            elif [ "${name#"$BASE_TAG".}" != "$name" ]; then
              suffix="${name#"$BASE_TAG".}"
            fi
            if [ -n "$suffix" ]; then
              num="${suffix%%-*}"
              num="${num%%_*}"
              if [ "$suffix" = "0" ] || echo "$num" | grep -qE '^[0-9]+$'; then
                echo "same-day exist: $name"
                OCC=1
                if echo "$num" | grep -qE '^[0-9]+$' && [ "$num" -gt "$MAXN" ]; then
                  MAXN="$num"
                fi
              fi
            fi
          done < <(all_existing_names)

          if [ "$OCC" = "1" ] || [ "$MAXN" != "0" ]; then
            TAG="${BASE_TAG}.$((MAXN + 1))"
          else
            TAG="${BASE_TAG}"
          fi

          # A commit that was already released gets no new tag; its release is reused and its assets clobbered.
          # The notes carry the full sha, which is what the match is made on.
          # Drafts and -pre tags are skipped, so a draft is never promoted.
          RTAG=$(gh_retry "repos/$REPO_S/releases?per_page=100" --paginate \
                   --jq ".[] | select(.draft == false) | select(.tag_name | endswith(\"-pre\") | not) | select((.body | contains(\"$SHA\")) and (.body | contains(\"$VERSION\"))) | .tag_name" \
                   2>/dev/null | head -n1 || true)
          if [ -n "$RTAG" ]; then
            echo "commit $SHA already released as $RTAG -> overriding instead of a new tag"
            TAG="$RTAG"
          fi
          IDENT="$TAG"
        else
          # One rolling draft release for every pre-release build.
          TAG="${VERSION}-pre"

          # Counter over the assets kept on the rolling draft.
          # The first build of the day is ...-<DATE>-<short>.img, later ones are ...-<DATE>.N-<short>.img.
          # Legacy "-N.<short>" names still count, but an all-digit short id does not.
          # SEEN separates "nothing today" from "first build exists".
          N=0
          SEEN=0
          PREFIX="OrangeFox-X625D-$VERSION-$DATE"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            case "$name" in
              "$PREFIX".*)
                # .N-<short>.img
                rest="${name#"$PREFIX".}"
                case "$rest" in
                  [0-9]*-*) num="${rest%%-*}" ;;
                  *)        num="" ;;
                esac
                ;;
              "$PREFIX"-*)
                # -<short>.img, or legacy -N.<short>.img (needs its 2nd dot)
                rest="${name#"$PREFIX"-}"
                case "$rest" in
                  [0-9]*.*.*) num="${rest%%.*}" ;;
                  *)          num="" ;;
                esac
                ;;
              *)
                continue
                ;;
            esac
            SEEN=1
            if [ -n "$num" ] && [ -z "${num//[0-9]/}" ] && [ "$num" -gt "$N" ]; then
              N="$num"
            fi
          done < <(gh api "repos/$REPO_S/releases/tags/$TAG" --jq '.assets[].name' 2>/dev/null || true)

          if [ "$SEEN" = "0" ]; then
            # First build of the day: no counter, exactly like a release tag.
            IDENT="${VERSION}-${DATE}-${SHORT}"
          else
            IDENT="${VERSION}-${DATE}.$((N + 1))-${SHORT}"
          fi
          echo "pre-release build $IDENT on rolling release $TAG"
        fi
        echo "TAG chosen: $TAG"

        # Two simultaneous runs could grab the same .N.
        # Sequential runs, the normal case, are strictly incremental.
        # The asset name is the build identity.
        FILENAME="OrangeFox-X625D-$IDENT"
        BUILDINFO="build-info-$IDENT.txt"

        echo "TAG=$TAG" >> $GITHUB_ENV
        echo "BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "DT_SHA=$SHA" >> $GITHUB_ENV
        echo "FILENAME=$FILENAME" >> $GITHUB_ENV
        echo "BUILDINFO=$BUILDINFO" >> $GITHUB_ENV

        cp fox/out/target/product/X625D/recovery.img "$FILENAME.img"
        cp fox/out/target/product/X625D/build-info.txt "$BUILDINFO"
        ls -lh "$FILENAME.img" "$BUILDINFO"
        cat "$BUILDINFO"

    - name: Prepare release notes
      # Changelog = device-tree commits between the previous published release and this commit, via the compare API.
      # Tags in this repo point at device-tree commits directly.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cd device-tree
        MSG=$(git log -1 --pretty=%s)
        SHA=$(git rev-parse HEAD)
        SHORT=$(git rev-parse --short HEAD)
        BRANCH="${{ env.BRANCH }}"
        REPO="${GITHUB_REPOSITORY}"
        TAG="${{ env.TAG }}"

        ghc_retry() { # retry wrapper, same policy as gh_retry
          local out i
          for i in $(seq 1 120); do
            if out=$(gh "$@" 2>/tmp/gh-c.err); then printf '%s\n' "$out"; return 0; fi
            err="$(cat /tmp/gh-c.err 2>/dev/null || true)"
            if printf '%s' "$err" | grep -qiE 'resource not accessible|Bad credentials|unauthorized|HTTP 40[14]'; then
              echo "gh '$*' unrecoverable: $err" >&2; return 1
            fi
            sleep 30
          done
          echo "gh '$*' still failing after 1h" >&2; return 1
        }

        # Newest PUBLISHED release before this one.
        # Drafts are skipped, so a chain of drafts still diffs against the last real release.
        # An override run reuses a stale created_at, which just widens the range.
        PREVTAG=$(ghc_retry api "repos/$REPO/releases?per_page=100" --paginate \
          --jq '.[] | select(.draft | not) | "\(.created_at) \(.tag_name)"' | sort -r \
          | awk '$2 != "'"$TAG"'" {print $2; exit}')
        CHANGELOG=""
        if [ -n "$PREVTAG" ]; then
          CHANGELOG=$(ghc_retry api "repos/$REPO/compare/$PREVTAG...$SHA" \
            --jq '.commits[] | "- " + (.commit.message | split("\n")[0]) + " ([" + .sha[0:7] + "](https://github.com/'"$REPO"'/commit/" + .sha + "))"')
        fi

        cat > $GITHUB_WORKSPACE/release-notes.md <<EOF
        Unofficial OrangeFox Recovery for Infinix X625D $TAG

        Build: \`$FILENAME.img\`

        Device tree: [\`$BRANCH\`](https://github.com/$REPO/tree/$BRANCH) — [\`$SHORT\`](https://github.com/$REPO/commit/$SHA) $MSG

        EOF
        if [ -n "$CHANGELOG" ]; then
          {
            echo ""
            echo "### Changelog ($PREVTAG...$SHORT)"
            echo ""
            printf '%s\n' "$CHANGELOG"
          } >> $GITHUB_WORKSPACE/release-notes.md
        else
          echo "(initial release - no changelog)" >> $GITHUB_WORKSPACE/release-notes.md
        fi
        cat $GITHUB_WORKSPACE/release-notes.md

    - name: Publish release
      # Stable goes to a published release.
      # A pre-release goes to the rolling draft (<VERSION>-pre), refreshed on every build.
      run: |
        export GH_TOKEN="${GITHUB_TOKEN}"
        REPO="${GITHUB_REPOSITORY}"
        CREATE_ARGS=()

        # Pre-releases ship the image only, since the notes carry the build info.
        # Stable releases also attach build-info-*.txt.
        ASSETS=("$FILENAME.img")
        if [ "${{ inputs.release_type }}" = "release" ]; then
          ASSETS+=("$BUILDINFO")
        else
          CREATE_ARGS+=(--draft --prerelease)
          echo "pre-release -> rolling draft release $TAG (image only)"
        fi

        publish() {
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "release $TAG already exists - refreshing its notes and assets"
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md -R "$REPO"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber -R "$REPO"
          else
            echo "creating release $TAG"
            # --target pins the tag to the built commit.
            # This matters because a draft gets its tag only when published.
            # A tag without a release object falls back to upload.
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
               --target "$DT_SHA" "${CREATE_ARGS[@]}" -R "$REPO" "${ASSETS[@]}" ||
              gh release upload "$TAG" "${ASSETS[@]}" --clobber -R "$REPO"
          fi
        }

        # Same retry policy as above: 30s backoff, 1h cap, permanent errors fail.
        for i in $(seq 1 120); do
          if out=$(publish 2>&1); then
            printf '%s\n' "$out"
            exit 0
          fi
          if printf '%s' "$out" | grep -qiE 'resource not accessible|unauthorized|Bad credentials|HTTP 40[14]'; then
            echo "irrecoverable publish error (check workflow permissions): $out" >&2
            exit 1
          fi
          echo "publish attempt $i failed, waiting 30s: $out"
          sleep 30
        done
        echo "publish still failing after 1h of retries" >&2
        exit 1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
